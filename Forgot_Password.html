{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Forgot Password 🔐</h2>

        <p class="sub-text">
            Enter your registered email address.
            We will send you an OTP.
        </p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Send OTP
            </button>

        </form>

        <div class="auth-links">

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Reset Password 🔒</h2>

        <p class="sub-text">
            Enter your new password below.
        </p>

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button type="submit">
                Change Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
